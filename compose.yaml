services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
      JAVA_OPTS_APPEND: "-Dkeycloak.migration.replace-placeholders=true"
      # ブラウザが解決できる公開 issuer。アプリは下記の内部 URL をバックチャネルに使う。
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-mfa-demo.json:/opt/keycloak/data/import/realm-mfa-demo.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build: .
    environment:
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: "false"
      OIDC_ISSUER: http://localhost:8080/realms/mfa-demo
      OIDC_BACKCHANNEL_ISSUER: http://keycloak:8080/realms/mfa-demo
      OIDC_CLIENT_ID: mfa-web
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URI: http://localhost:3000/callback
      OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
